[package]
name = "ferrotherm-ommx"
version = "0.1.0"
edition = "2021"
description = "Export a ferrotherm program as an OMMX instance: the interchange format the Ising/QUBO modelling layers have converged on. Zero dependencies, hand-rolled protobuf, validated against the reference implementation."
license = "Apache-2.0"
repository = "https://github.com/dcharlot-physicalai-bmi/ferrotherm"
keywords = ["ommx", "qubo", "ising", "interchange", "optimization"]
categories = ["science", "encoding"]

# Std only, like the core.
#
# The Rust `ommx` crate is at 3.0.0-beta.3 while its Python counterpart is stable at 2.6.2, and a
# shipped bridge should not depend on a beta. The wire format for the subset a ferrotherm program
# needs -- binary variables and a quadratic objective -- is varints and length-delimited fields, and
# the schema is pinned in `schema.rs` with the field numbers read out of the reference
# implementation's own descriptors rather than from prose. Correctness is established by having the
# reference implementation READ what this writes; see `tests/`.
[dependencies]
ferrotherm = { version = "0.10", path = ".." }
