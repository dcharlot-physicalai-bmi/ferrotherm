[package]
name = "ferrotherm-gpu"
version = "0.3.24"
edition = "2024"
# A POLICY floor, deliberately above the technical one, and it is stated that way so nobody
# later "corrects" it downward on the grounds that older toolchains happen to work.
#
# The technical floor is 1.88: edition 2024 needs 1.85, and the let-chains in `embed` and `fabric`
# need 1.88 (1.85 and 1.86 were installed and rejected by the compiler). This crate declares 1.96
# anyway. It is a 2026 library for hardware that does not exist yet, and carrying compatibility with
# toolchains a year old buys nothing and costs the ability to use the language as it is now.
#
# `scripts/check-msrv.sh` compiles the ENTIRE workspace, tests and examples included, on exactly
# this toolchain, so the line is a checked claim rather than a hope -- what it verifies is that the
# floor is high enough, which is the direction that can break a user.
rust-version = "1.96"
description = "Native GPU sampling for ferrotherm: the same WGSL sweep the browser runs, on Vulkan, Metal or DX12. Kept out of the core crate so `ferrotherm` stays std-only with zero dependencies."
license = "Apache-2.0"
repository = "https://github.com/dcharlot-physicalai-bmi/ferrotherm"
keywords = ["thermodynamic", "ising", "gibbs-sampling", "gpu", "wgpu"]
readme = "README.md"
categories = ["science", "algorithms", "simulation"]

# The core crate's headline is "std-only, zero dependencies", and that is a property worth keeping
# rather than a slogan: it is what makes `ferrotherm` compile unchanged to wasm32-unknown-unknown
# and to a microcontroller. A GPU backend needs a driver stack, so it lives out here beside
# `silicon`, `serve` and `cloud` -- each of which exists for the same reason.
[dependencies]
ferrotherm = { version = "0.42", path = ".." }
wgpu = "30"
pollster = "0.4"

# The energy comparison needs both a GPU and a meter. A dev-dependency rather than a real one:
# nothing in this crate needs to measure power, but the question "is it also cheaper" cannot be
# asked without both, and it is the question the whole stack exists to answer.
[dev-dependencies]
ferrotherm-meter = { version = "0.4", path = "../meter" }

[lints]
workspace = true
