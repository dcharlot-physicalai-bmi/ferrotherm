[package]
name = "ferrotherm"
version = "0.41.0"
edition = "2024"
# A POLICY floor, deliberately above the technical one, and it is stated that way so nobody
# later "corrects" it downward on the grounds that older toolchains happen to work.
#
# The technical floor is 1.88: edition 2024 needs 1.85, and the let-chains in `embed` and `fabric`
# need 1.88 (1.85 and 1.86 were installed and rejected by the compiler). This crate declares 1.96
# anyway. It is a 2026 library for hardware that does not exist yet, and carrying compatibility with
# toolchains a year old buys nothing and costs the ability to use the language as it is now.
#
# `scripts/check-msrv.sh` compiles the ENTIRE workspace, tests and examples included, on exactly
# this toolchain, so the line is a checked claim rather than a hope -- what it verifies is that the
# floor is high enough, which is the direction that can break a user.
rust-version = "1.96"
description = "Thermodynamic computing in pure Rust: sparse energy-based models, chromatic block-Gibbs, parallel tempering, thermodynamic linear algebra, stochastic differentiable programs, a variational compiler onto device topologies, exact inference by variable elimination, planted instances with known optima, sampler certificates, and a first-class joules ledger. std-only, zero dependencies, wasm-clean, deterministic by seed."
license = "Apache-2.0"
repository = "https://github.com/dcharlot-physicalai-bmi/ferrotherm"
homepage = "https://energy.physicalai-bmi.org/thermo"
documentation = "https://docs.rs/ferrotherm"
readme = "README.md"
keywords = ["thermodynamic", "ising", "gibbs-sampling", "energy-based-models", "probabilistic"]
categories = ["science", "algorithms", "simulation", "wasm", "mathematics"]
# Not source. web-tests/node_modules alone is 15 MB of Playwright, and a crate that ships its own
# test runner's dependencies is asking every downstream build to download them.
# What a crate consumer needs is source. The browser pages are excluded along with their compiled
# wasm: a binary artefact inside a source crate goes stale the moment the library changes, and a
# stale surface that still LOADS is the failure mode this project spent a week learning to fear.
# The pages live in the repository and on the Institute site, both of which are rebuilt from source.
exclude = [
    "web/",
    "target/",
    "web-tests/",              # 15 MB of Playwright, and a test runner is not a dependency
    "zig/.zig-cache/",         # 47 MB of Zig build objects
    "zig/zig-out/",
    "julia/Ferrotherm/Manifest.toml",
    "docs/",                   # the browser pages and their compiled wasm
]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true

# Three lints this codebase deliberately does not follow, each with the reason it does not.
#
# Recorded here rather than sprinkled as `#[allow]`, so the reasoning exists once and a reader can
# weigh it. Everything NOT listed is denied in CI: `cargo clippy --workspace --all-targets
# -D warnings`, which before this existed had never linted five of the six crates.
[workspace.lints.clippy]
# `for i in 0..n { s[i] }` where `i` is a SPIN INDEX, a lattice site, a colour class or a LUT entry.
# The index is the physical identity, it is usually also used to reach a neighbour or a second
# array, and `enumerate()` renames it to something less meaningful. 72 sites; the 20 highest-risk
# were read individually and every one was correct.
needless_range_loop = "allow"
# `!(w > 0.0)` is NOT `w <= 0.0`, and the difference is NaN: the first REJECTS it, the second
# ACCEPTS it. Demonstrated, not assumed -- and taking clippy's advice at these 7 sites would have
# admitted NaN weights, which is precisely the defect fixed in 0.12.0's successor.
neg_cmp_op_on_partial_ord = "allow"
# A physics kernel takes the parameters the physics has. Bundling beta, seed, sweeps, stages and a
# ledger into a struct to satisfy a count of seven moves the arity, it does not reduce it.
too_many_arguments = "allow"

# ---- the pedantic set, decided rather than inherited ------------------------------------------
#
# `cargo clippy -W clippy::pedantic -W clippy::nursery` reports 4,266 findings on this workspace.
# Fixing 4,266 things is not a quality programme, it is a way to spend a week changing code that
# was already correct -- and several of those lints are actively WRONG for a numerics crate that
# checks itself against closed forms. So the set is chosen, each choice is justified here, and CI
# runs at `-D warnings`, which makes the count zero by construction and keeps it there.
#
# DENIED: lints whose findings were real and are now fixed.
must_use_candidate = "deny"           # a result nobody is forced to read is a result nobody reads;
                                      # this one found 3 tests discarding a solver's answer
redundant_closure_for_method_calls = "deny"
cloned_instead_of_copied = "deny"
explicit_iter_loop = "deny"
uninlined_format_args = "deny"
semicolon_if_nothing_returned = "deny"
manual_let_else = "deny"
redundant_else = "deny"
inefficient_to_string = "deny"
implicit_clone = "deny"
map_unwrap_or = "deny"
unnested_or_patterns = "deny"
doc_markdown = "deny"

# ALLOWED, with the reason. Each of these is a lint that is right in general and wrong here.
#
# 465 sites, and every one is a count being divided: `samples as f64 / n as f64`. A spin index or
# a sample count that exceeded 2^53 would have exhausted memory long before it exhausted the
# mantissa, and rewriting them as fallible conversions would put a `?` on arithmetic that cannot
# fail.
cast_precision_loss = "allow"
# 428 sites, and THIS ONE CHANGES ANSWERS. `a*b + c` fused into `mul_add` keeps an extra internal
# bit, so the result differs in the last place -- which is exactly where this crate does its work:
# `free_energy`, `hopfield` and `continuous` are verified against closed forms at 1e-9, and
# `wgsl`/`ffi` parity tests compare CPU against GPU and against other bindings BIT FOR BIT. A lint
# that silently improves accuracy on one side of a bit-exactness test is a lint that breaks it.
suboptimal_flops = "allow"
# Every long literal in this crate is TRANSCRIBED from a published source and checked by reading it
# against that source: 6364136223846793005 is PCG's multiplier as the paper prints it, 1304000 is an
# Alveo U55C's LUT count as the datasheet prints it, 0x9E3779B97F4A7C15 is the golden-ratio constant
# as the hashing literature prints it. Underscores make those comparisons harder, and a constant
# nobody can check against its source is the failure this project cares about far more than
# readability.
unreadable_literal = "allow"
# This codebase declares a `const` immediately above its use, with the comment that justifies the
# VALUE directly above the const -- `MAX_COLOUR_CLASSES` in `ftp`, `LIM` in `certify`, `FLOOR` in
# `adaptive`. Hoisting them to the top of the function separates each number from the paragraph
# explaining why it is that number, which is the only thing making it reviewable.
items_after_statements = "allow"
# `Precision::Exact => 0.0` and `Precision::Unstated => 0.0` return the same value and mean opposite
# things -- "nothing is lost" versus "nobody said". Collapsing them to `Exact | Unstated` would erase
# in the source exactly the distinction the comment beside them exists to preserve, and it is the
# distinction `Verdict::LimitsUnstated` is built on.
match_same_arms = "allow"
# `device::Topology`, `graph::Graph`, `ledger::Ledger`. The module IS the namespace and the
# repetition is what makes `use ferrotherm::ledger::Ledger` read correctly at the call site.
module_name_repetitions = "allow"
# Vendor qubit indices are `u32` because the C ABI and every device file say `u32`; the graph is
# indexed by `usize` because that is what slices take. The conversion is the boundary, and it is
# checked where it matters (`Topology::node` returns `Option`).
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Both were ratcheted at 62 and 84 and are now zero, so they are denied like the rest. A `# Errors`
# section names the variants a call actually returns; a `# Panics` section names the assertion that
# fires, INCLUDING the ones whose honest answer is "never, and here is the invariant that makes it
# never" -- `exact::marginals` cannot exceed a width cap it already checked, and saying so is worth
# more than an empty section. `scripts/check-lints.sh` and its baseline were deleted with the last
# family: a ratchet tracking nothing is a gate that reads as work and does none.
missing_errors_doc = "deny"
missing_panics_doc = "deny"
# AUDITED, 2026-09-05, and the verdict is uniform: 142 sites, no defect. 131 are assertions on
# values that are exact by construction -- integer-valued Ising energies (-12.0, -3.0), powers of two
# (0.25), a padded slot that must weigh EXACTLY zero, a serialiser round-trip of 1e16 -- where an
# epsilon would not soften the test, it would delete it. Every non-assertion site was read
# individually, and two of them use exact equality as the MECHANISM:
#
#   fabric.rs  `let next = n - 1.0; if next == n { break }` finds where f64 saturates past 2^53.
#              An epsilon does not make this more robust; it makes it never terminate.
#   ffi.rs     `got == want || (got.is_nan() && want.is_nan())` is deliberate bit-equality, NaN
#              included: the claim is that an unaligned write produced the SAME BITS as an aligned
#              one, and comparing those approximately would assert nothing.
#
# This is therefore an allow with an audit behind it rather than a backlog. If a future site is
# genuinely sloppy, it will be sloppy in code that is new, and this comment is where to argue with.
float_cmp = "allow"

# `cfg(kani)` guards the machine-checked proof harnesses in src/*.rs. Declaring it at the
# WORKSPACE level -- the crate inherits with `[lints] workspace = true`, and a member-level
# `[lints.rust]` beside that inheritance is a Cargo error, which is how this line found its home --
# is what stops rustc's unexpected_cfgs lint firing on every build that is not the Kani toolchain.
# The proofs are real code, compiled and run by `cargo kani` (scripts/check-proofs.sh), and
# invisible to every other build.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
# Every public item in the core crate carries a doc, and this is what keeps it that way. It was 509
# short; the standard applied to close it was that a doc must carry an INVARIANT, a unit, a range or
# a provenance rather than restate the field's name -- `Graph::offset` says the neighbours of `i` are
# `nbr[offset[i]..offset[i+1]]`, `Graph::n_edges` says it is `nbr.len() / 2` and not `nbr.len()`,
# `FpgaTarget::provenance` says where the datasheet numbers came from. A deny rather than a ratchet,
# because zero is only stable if nothing may re-add the first one.
missing_docs = "deny"

[workspace]
members = [".", "silicon", "serve", "cloud", "gpu", "meter"]

[lints]
workspace = true
