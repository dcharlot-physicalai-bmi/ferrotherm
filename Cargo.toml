[package]
name = "ferrotherm"
version = "0.14.0"
edition = "2021"
description = "Thermodynamic computing in pure Rust: sparse energy-based models, chromatic block-Gibbs, parallel tempering, thermodynamic linear algebra, stochastic differentiable programs, a variational compiler onto device topologies, exact inference by variable elimination, planted instances with known optima, sampler certificates, and a first-class joules ledger. std-only, zero dependencies, wasm-clean, deterministic by seed."
license = "Apache-2.0"
repository = "https://github.com/dcharlot-physicalai-bmi/ferrotherm"
homepage = "https://energy.physicalai-bmi.org/thermo"
documentation = "https://docs.rs/ferrotherm"
readme = "README.md"
keywords = ["thermodynamic", "ising", "gibbs-sampling", "energy-based-models", "probabilistic"]
categories = ["science", "algorithms", "simulation", "wasm", "mathematics"]
# Not source. web-tests/node_modules alone is 15 MB of Playwright, and a crate that ships its own
# test runner's dependencies is asking every downstream build to download them.
# What a crate consumer needs is source. The browser pages are excluded along with their compiled
# wasm: a binary artefact inside a source crate goes stale the moment the library changes, and a
# stale surface that still LOADS is the failure mode this project spent a week learning to fear.
# The pages live in the repository and on the Institute site, both of which are rebuilt from source.
exclude = [
    "web/",
    "target/",
    "web-tests/",              # 15 MB of Playwright, and a test runner is not a dependency
    "zig/.zig-cache/",         # 47 MB of Zig build objects
    "zig/zig-out/",
    "julia/Ferrotherm/Manifest.toml",
    "docs/",                   # the browser pages and their compiled wasm
]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true

# Three lints this codebase deliberately does not follow, each with the reason it does not.
#
# Recorded here rather than sprinkled as `#[allow]`, so the reasoning exists once and a reader can
# weigh it. Everything NOT listed is denied in CI: `cargo clippy --workspace --all-targets
# -D warnings`, which before this existed had never linted five of the six crates.
[workspace.lints.clippy]
# `for i in 0..n { s[i] }` where `i` is a SPIN INDEX, a lattice site, a colour class or a LUT entry.
# The index is the physical identity, it is usually also used to reach a neighbour or a second
# array, and `enumerate()` renames it to something less meaningful. 72 sites; the 20 highest-risk
# were read individually and every one was correct.
needless_range_loop = "allow"
# `!(w > 0.0)` is NOT `w <= 0.0`, and the difference is NaN: the first REJECTS it, the second
# ACCEPTS it. Demonstrated, not assumed -- and taking clippy's advice at these 7 sites would have
# admitted NaN weights, which is precisely the defect fixed in 0.12.0's successor.
neg_cmp_op_on_partial_ord = "allow"
# A physics kernel takes the parameters the physics has. Bundling beta, seed, sweeps, stages and a
# ledger into a struct to satisfy a count of seven moves the arity, it does not reduce it.
too_many_arguments = "allow"

[workspace]
members = [".", "silicon", "serve", "cloud", "gpu", "meter"]

[lints]
workspace = true
