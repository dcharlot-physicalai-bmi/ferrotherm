[package]
name = "ferrotherm-cloud"
version = "0.1.30"
edition = "2024"
# MEASURED, not guessed: `scripts/check-msrv.sh` compiles the whole workspace on exactly this
# toolchain and fails if it does not build, so this line is a checked claim rather than a hope.
# 1.88 is the floor because edition 2024 needs 1.85 and the let-chains in `embed` and `fabric`
# need 1.88; 1.85 and 1.86 were tried and rejected by the compiler.
rust-version = "1.88"
description = "Cloud fabrics for ferrotherm: drives real third-party annealing silicon through the Device trait, starting with Hitachi's CMOS annealing ASIC. Separate crate because it needs a TLS client and the core has no dependencies."
license = "Apache-2.0"
repository = "https://github.com/dcharlot-physicalai-bmi/ferrotherm"
keywords = ["thermodynamic", "ising", "annealing", "hitachi", "sampling"]
readme = "README.md"
categories = ["science", "api-bindings", "simulation"]

[dependencies]
ferrotherm = { version = "0.41", path = ".." }
ureq = "2"

[dev-dependencies]

[lints]
workspace = true
