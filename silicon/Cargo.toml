[package]
name = "ferrotherm-silicon"
version = "0.1.0"
edition = "2021"
description = "The IPAI-owned path to metal for ferrotherm: pure-Rust FPGA silicon layer — p-bit LUT fabrics, chip databases, and bitstream emission for the ferrotherm deployment ladder (Alchitry V2, Kria KV260, M.2 Artix, Alveo, AWS F2). Zero dependencies. Selected algorithms ported with permission from Open Interface Engineering's openie-fpga; this crate is fully independent of it."
license = "Apache-2.0"
repository = "https://github.com/dcharlot-physicalai-bmi/ferrotherm"
readme = "README.md"
keywords = ["fpga", "bitstream", "thermodynamic", "pbit", "ising"]
categories = ["embedded", "hardware-support", "science"]

[dependencies]
ferrotherm = { version = "0.5", path = ".." }
