[package]
name = "ferrotherm-silicon"
version = "0.2.29"
edition = "2024"
# A POLICY floor, deliberately above the technical one, and it is stated that way so nobody
# later "corrects" it downward on the grounds that older toolchains happen to work.
#
# The technical floor is 1.88: edition 2024 needs 1.85, and the let-chains in `embed` and `fabric`
# need 1.88 (1.85 and 1.86 were installed and rejected by the compiler). This crate declares 1.96
# anyway. It is a 2026 library for hardware that does not exist yet, and carrying compatibility with
# toolchains a year old buys nothing and costs the ability to use the language as it is now.
#
# `scripts/check-msrv.sh` compiles the ENTIRE workspace, tests and examples included, on exactly
# this toolchain, so the line is a checked claim rather than a hope -- what it verifies is that the
# floor is high enough, which is the direction that can break a user.
rust-version = "1.96"
description = "The IPAI-owned path to metal for ferrotherm: pure-Rust FPGA silicon layer — binary-stochastic-neuron LUT fabrics, chip databases, and bitstream emission for the ferrotherm deployment ladder (Alchitry V2, Kria KV260, M.2 Artix, Alveo, AWS F2). Zero dependencies. Selected algorithms ported with permission from Open Interface Engineering's openie-fpga; this crate is fully independent of it."
license = "Apache-2.0"
repository = "https://github.com/dcharlot-physicalai-bmi/ferrotherm"
readme = "README.md"
keywords = ["fpga", "bitstream", "thermodynamic", "sampling", "ising"]
categories = ["embedded", "hardware-support", "science"]

[features]
flash = ["dep:nusb", "dep:pollster"]

[dependencies]
ferrotherm = { version = "0.44", path = ".." }
nusb = { version = "0.1", optional = true }
pollster = { version = "0.4", optional = true }

[[example]]
name = "idcode"
required-features = ["flash"]

[[example]]
name = "probe"
required-features = ["flash"]

[[example]]
name = "load_bit"
required-features = ["flash"]

[[example]]
name = "config_trace"
required-features = ["flash"]

[[example]]
name = "undo_check"
required-features = ["flash"]

[[example]]
name = "recover"
required-features = ["flash"]

[[example]]
name = "readback"
required-features = ["flash"]

[lints]
workspace = true
