[package]
name = "ferrotherm-silicon"
version = "0.2.26"
edition = "2024"
# MEASURED, not guessed: `scripts/check-msrv.sh` compiles the whole workspace on exactly this
# toolchain and fails if it does not build, so this line is a checked claim rather than a hope.
# 1.88 is the floor because edition 2024 needs 1.85 and the let-chains in `embed` and `fabric`
# need 1.88; 1.85 and 1.86 were tried and rejected by the compiler.
rust-version = "1.88"
description = "The IPAI-owned path to metal for ferrotherm: pure-Rust FPGA silicon layer — binary-stochastic-neuron LUT fabrics, chip databases, and bitstream emission for the ferrotherm deployment ladder (Alchitry V2, Kria KV260, M.2 Artix, Alveo, AWS F2). Zero dependencies. Selected algorithms ported with permission from Open Interface Engineering's openie-fpga; this crate is fully independent of it."
license = "Apache-2.0"
repository = "https://github.com/dcharlot-physicalai-bmi/ferrotherm"
readme = "README.md"
keywords = ["fpga", "bitstream", "thermodynamic", "sampling", "ising"]
categories = ["embedded", "hardware-support", "science"]

[features]
flash = ["dep:nusb", "dep:pollster"]

[dependencies]
ferrotherm = { version = "0.41", path = ".." }
nusb = { version = "0.1", optional = true }
pollster = { version = "0.4", optional = true }

[[example]]
name = "idcode"
required-features = ["flash"]

[[example]]
name = "probe"
required-features = ["flash"]

[[example]]
name = "load_bit"
required-features = ["flash"]

[[example]]
name = "config_trace"
required-features = ["flash"]

[[example]]
name = "undo_check"
required-features = ["flash"]

[[example]]
name = "recover"
required-features = ["flash"]

[[example]]
name = "readback"
required-features = ["flash"]

[lints]
workspace = true
